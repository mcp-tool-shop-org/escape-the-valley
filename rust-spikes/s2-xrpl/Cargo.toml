[package]
name = "s2-xrpl"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "s2-xrpl"
path = "src/main.rs"

[dependencies]
xrpl-rust = { version = "=1.3.0", default-features = false, features = [
    "std",
    "tokio-rt",
    "core",
    "wallet",
    "models",
    "utils",
    "helpers",
    "json-rpc",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
serde_json = "1"
hex = "0.4"
