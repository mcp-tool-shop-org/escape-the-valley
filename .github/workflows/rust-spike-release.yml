# Spike S4 dry-run release workflow:
# - workflow_dispatch only (no GitHub Release, no TestPyPI, no npm, no tag)
# - builds launcher-named binaries: s4-hello-<version>-<os>-<arch>[.exe]
#   for linux-x64 and win-x64 on ubuntu-latest, and darwin-arm64 + darwin-x64 on macos-latest
# - builds maturin bindings="bin" wheels for all 4 targets (manylinux2014 for Linux)
# - generates checksums-<version>.txt in GNU sha256sum format
# - runs a per-OS smoke job (--version and --self-test) against the built binaries

name: Rust Spike Release (S4)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "rust-2.0"

env:
  VERSION: "0.1.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.98.1 and targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu

      - name: Install mingw-w64 and maturin + zig
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 patchelf
          python3 -m pip install --upgrade pip "maturin>=1.7,<2.0" ziglang

      - name: Build linux-x64 and win-x64 binaries + wheels
        working-directory: rust-spikes
        run: |
          mkdir -p dist/bin-linux-x64 dist/bin-win-x64 dist/wheel-linux-x64 dist/wheel-win-x64

          # 1. linux-x64 binary (via cargo-zigbuild / zig target or standard gnu)
          cargo build --release -p s4-hello --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/s4-hello "dist/bin-linux-x64/s4-hello-${VERSION}-linux-x64"

          # 2. win-x64 binary cross-compiled from Ubuntu via mingw-w64
          cargo build --release -p s4-hello --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/s4-hello.exe "dist/bin-win-x64/s4-hello-${VERSION}-win-x64.exe"

          # 3. linux-x64 manylinux2014 wheel via maturin + zig
          maturin build --release --manifest-path s4-hello/Cargo.toml \
            --target x86_64-unknown-linux-gnu --zig --compatibility manylinux2014 \
            --out dist/wheel-linux-x64

          # 4. win-x64 wheel cross-compiled on Ubuntu via maturin
          maturin build --release --manifest-path s4-hello/Cargo.toml \
            --target x86_64-pc-windows-gnu \
            --out dist/wheel-win-x64

          ls -lh dist/bin-linux-x64 dist/bin-win-x64 dist/wheel-linux-x64 dist/wheel-win-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-x64
          path: rust-spikes/dist/bin-linux-x64/s4-hello-${{ env.VERSION }}-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-win-x64
          path: rust-spikes/dist/bin-win-x64/s4-hello-${{ env.VERSION }}-win-x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-x64
          path: rust-spikes/dist/wheel-linux-x64/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-win-x64
          path: rust-spikes/dist/wheel-win-x64/*.whl
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.98.1 and targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install maturin
        run: python3 -m pip install --upgrade pip "maturin>=1.7,<2.0"

      - name: Build darwin-arm64 and darwin-x64 binaries + wheels
        working-directory: rust-spikes
        run: |
          mkdir -p dist/bin-darwin-arm64 dist/bin-darwin-x64 dist/wheel-darwin-arm64 dist/wheel-darwin-x64

          cargo build --release -p s4-hello --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/s4-hello "dist/bin-darwin-arm64/s4-hello-${VERSION}-darwin-arm64"

          cargo build --release -p s4-hello --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/s4-hello "dist/bin-darwin-x64/s4-hello-${VERSION}-darwin-x64"

          maturin build --release --manifest-path s4-hello/Cargo.toml \
            --target aarch64-apple-darwin \
            --out dist/wheel-darwin-arm64

          maturin build --release --manifest-path s4-hello/Cargo.toml \
            --target x86_64-apple-darwin \
            --out dist/wheel-darwin-x64

          ls -lh dist/bin-darwin-arm64 dist/bin-darwin-x64 dist/wheel-darwin-arm64 dist/wheel-darwin-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-darwin-arm64
          path: rust-spikes/dist/bin-darwin-arm64/s4-hello-${{ env.VERSION }}-darwin-arm64
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-darwin-x64
          path: rust-spikes/dist/bin-darwin-x64/s4-hello-${{ env.VERSION }}-darwin-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-darwin-arm64
          path: rust-spikes/dist/wheel-darwin-arm64/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-darwin-x64
          path: rust-spikes/dist/wheel-darwin-x64/*.whl
          if-no-files-found: error

  checksums:
    needs: [build-ubuntu, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate GNU sha256sum checksums
        run: |
          cd artifacts
          sha256sum s4-hello-* > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ env.VERSION }}
          path: artifacts/checksums-${{ env.VERSION }}.txt
          if-no-files-found: error

  smoke-linux:
    needs: [build-ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-linux-x64
          path: bin

      - name: Smoke test linux-x64 binary
        run: |
          chmod +x "bin/s4-hello-${VERSION}-linux-x64"
          "bin/s4-hello-${VERSION}-linux-x64" --version
          "bin/s4-hello-${VERSION}-linux-x64" --self-test

  smoke-windows:
    needs: [build-ubuntu]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-win-x64
          path: bin

      - name: Smoke test cross-built win-x64 binary on Windows
        shell: bash
        run: |
          "./bin/s4-hello-${VERSION}-win-x64.exe" --version
          "./bin/s4-hello-${VERSION}-win-x64.exe" --self-test

  smoke-macos:
    needs: [build-macos]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-darwin-arm64
          path: bin-arm64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-darwin-x64
          path: bin-x64

      - name: Smoke test darwin-arm64 and darwin-x64 binaries on macOS
        run: |
          chmod +x "bin-arm64/s4-hello-${VERSION}-darwin-arm64" "bin-x64/s4-hello-${VERSION}-darwin-x64"
          "bin-arm64/s4-hello-${VERSION}-darwin-arm64" --version
          "bin-arm64/s4-hello-${VERSION}-darwin-arm64" --self-test
          arch -x86_64 "./bin-x64/s4-hello-${VERSION}-darwin-x64" --version || "./bin-x64/s4-hello-${VERSION}-darwin-x64" --version
          arch -x86_64 "./bin-x64/s4-hello-${VERSION}-darwin-x64" --self-test || "./bin-x64/s4-hello-${VERSION}-darwin-x64" --self-test
