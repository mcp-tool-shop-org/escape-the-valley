# Build platform binaries for npm distribution via @mcptoolshop/npm-launcher.
# Asset naming convention (locked):
#   escape-the-valley-<version>-<os>-<arch>[.exe]
#   THIRD_PARTY_NOTICES-<os>-<arch>.txt
#   checksums-<version>.txt
#
# linux-x64 + win-x64 + darwin-arm64. macOS parity restored at the director's
# request (2026-06-15): the macos runner costs ~10x Linux minutes, but keeps
# `npx @mcptoolshop/escape-the-valley` working on Apple Silicon without a pip
# fallback. pip/pipx remains available on every platform.

name: Release Binaries

on:
  release:
    types: [published]
  # workflow_run chains off the Release workflow completing — a Release created
  # by release.yml with GITHUB_TOKEN does not fire `release: published`. Gated
  # on success in the build job; the tag is resolved from
  # github.event.workflow_run.head_branch (github.ref is main under this event).
  # See publish.yml for the full rationale.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.1.0). On release/workflow_run events the tag comes from the event.'
        required: true

env:
  TOOL_NAME: escape-the-valley
  ENTRYPOINT: src/escape_the_valley/__main__.py

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Under workflow_run, only build if the upstream Release succeeded (release /
    # workflow_dispatch set workflow_run to null → success check stays truthy).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          - os: windows-latest
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.18"

      - name: Set neutral UV_PYTHON_INSTALL_DIR outside user homes (G1)
        shell: bash
        run: |
          # G1: astral-sh/setup-uv sets UV_PYTHON_INSTALL_DIR under runner.temp
          # (/home/<x>/... on Linux and /Users/<x>/... on macOS), and local uv
          # defaults to ~/.local/share/uv/python or %APPDATA%\uv\python. uv
          # writes that install prefix into CPython's _sysconfigdata__*.py,
          # which PyInstaller bundles into the PYZ archive. Use /opt/uv-python
          # on Linux/macOS and C:\uv-python on Windows so no home path enters
          # _sysconfigdata.
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p /c/uv-python
            echo "UV_PYTHON_INSTALL_DIR=C:\\uv-python" >> "$GITHUB_ENV"
          else
            if [ ! -w /opt/uv-python ]; then
              sudo mkdir -p /opt/uv-python
              sudo chown "$(id -u):$(id -g)" /opt/uv-python
            fi
            echo "UV_PYTHON_INSTALL_DIR=/opt/uv-python" >> "$GITHUB_ENV"
          fi

      - run: uv python install 3.12.13

      - run: uv venv --python 3.12.13

      - name: Install dependencies + PyInstaller
        run: uv pip install ".[xrpl]" "pyinstaller>=6.9.0"

      - name: Remove PEP 610 direct_url.json build record from venv
        shell: bash
        run: |
          uv run --no-sync python -c '
          import pathlib, sysconfig
          purelib = pathlib.Path(sysconfig.get_path("purelib"))
          for p in purelib.glob("*.dist-info/direct_url.json"):
              p.unlink()
          remaining = list(purelib.glob("*.dist-info/direct_url.json"))
          if remaining:
              raise SystemExit(f"direct_url.json still present in venv: {remaining}")
          print("Removed direct_url.json from build venv.")
          '

      - name: Generate third-party notices
        run: uv run --no-sync python scripts/gen_third_party_notices.py --release THIRD_PARTY_NOTICES.txt

      - name: Build binary
        shell: bash
        env:
          # F-812f18ad: route the event-derived ref through env instead of
          # inline ${{ }} interpolation into this run: block. Template
          # substitution happens BEFORE bash parses the script, so a value
          # containing shell metacharacters (possible here: on workflow_dispatch,
          # github.event.inputs.tag is a free-form, unvalidated string anyone
          # with Actions-trigger rights can set) would otherwise become part of
          # the executed command. Env-var substitution happens after the script
          # text is fixed, so metacharacters are inert data.
          REF_NAME_RAW: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          REF_NAME="$REF_NAME_RAW"
          VERSION=${REF_NAME#v}
          # F-a4d8291c: PyInstaller's --add-data separator is OS-specific (`;`
          # on Windows, `:` elsewhere) -- this step runs under bash on every
          # matrix leg via `shell: bash`, but PyInstaller itself is a native
          # Windows Python process on windows-latest and parses the
          # SRC<sep>DEST spec using the target OS's separator, not the
          # invoking shell's.
          if [ "${{ runner.os }}" = "Windows" ]; then
            DATA_SEP=";"
          else
            DATA_SEP=":"
          fi
          # --no-sync: build from the env created by `uv pip install ".[xrpl]"`
          # above; do NOT re-resolve the project (which would drag in heavy
          # optional extras like [voice] -> voice-soundboard[kokoro] ->
          # onnxruntime and bloat the binary). The binary ships the base game
          # plus [xrpl] so the Ledger Backpack works in standalone/npx builds;
          # voice remains pip-install-only via `escape-the-valley[voice]`.
          #
          # F-a4d8291c: --add-data bundles the two non-Python files the game
          # needs at runtime that PyInstaller cannot discover on its own:
          # tui.tcss (TrailApp.CSS_PATH) and data/event_skeletons.json (~200
          # of the game's ~260 events -- event_loader.load_json_events()
          # silently returns [] if this is missing, so an unbundled JSON
          # ships a binary that starts cleanly and plays a quarter-game).
          # Issue #28: THIRD_PARTY_NOTICES.txt travels inside the binary beside
          # tui.tcss and is also attached to the GitHub Release below.
          uv run --no-sync pyinstaller --onefile --name "${{ env.TOOL_NAME }}" --console \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module dbm \
            --exclude-module _dbm \
            --collect-submodules rich \
            --collect-submodules textual \
            --collect-submodules xrpl \
            --collect-data textual \
            --collect-data xrpl \
            --add-data "src/escape_the_valley/tui.tcss${DATA_SEP}escape_the_valley" \
            --add-data "THIRD_PARTY_NOTICES.txt${DATA_SEP}escape_the_valley" \
            --add-data "src/escape_the_valley/data/event_skeletons.json${DATA_SEP}escape_the_valley/data" \
            "${{ env.ENTRYPOINT }}"
          uv run --no-sync python scripts/gen_third_party_notices.py --release --prune-toc build/escape-the-valley THIRD_PARTY_NOTICES.txt
          uv run --no-sync pyinstaller --noconfirm --onefile --name "${{ env.TOOL_NAME }}" --console \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module dbm \
            --exclude-module _dbm \
            --collect-submodules rich \
            --collect-submodules textual \
            --collect-submodules xrpl \
            --collect-data textual \
            --collect-data xrpl \
            --add-data "src/escape_the_valley/tui.tcss${DATA_SEP}escape_the_valley" \
            --add-data "THIRD_PARTY_NOTICES.txt${DATA_SEP}escape_the_valley" \
            --add-data "src/escape_the_valley/data/event_skeletons.json${DATA_SEP}escape_the_valley/data" \
            "${{ env.ENTRYPOINT }}"
          OUTNAME="${{ env.TOOL_NAME }}-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/${{ env.TOOL_NAME }}${{ matrix.ext }}" "dist/${OUTNAME}"
          cp "THIRD_PARTY_NOTICES.txt" "dist/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt"
          echo "ASSET_NAME=${OUTNAME}" >> "$GITHUB_ENV"

      - name: Verify third-party notices against PyInstaller TOC and check bundle archive
        shell: bash
        run: |
          uv run --no-sync python scripts/gen_third_party_notices.py --verify-pbs-archive
          uv run --no-sync python scripts/gen_third_party_notices.py --verify-toc build/escape-the-valley THIRD_PARTY_NOTICES.txt
          uv run --no-sync python scripts/gen_third_party_notices.py --verify-bundle "dist/$ASSET_NAME"
          uv run --no-sync python -c '
          import hashlib, pathlib, subprocess, sys
          bin_path = pathlib.Path(sys.argv[1])
          notices_path = pathlib.Path(sys.argv[2])
          raw = notices_path.read_bytes()
          if b"\r" in raw:
              raise SystemExit(f"CR byte found in {notices_path}")
          want_sha = hashlib.sha256(raw).hexdigest()
          for arg in ("licenses", "--licenses"):
              out = subprocess.check_output([str(bin_path), arg])
              got_sha = hashlib.sha256(out).hexdigest()
              if out != raw or got_sha != want_sha:
                  raise SystemExit(f"{arg} output sha256 {got_sha} != {notices_path} sha256 {want_sha}")
          print(f"[licenses-lf-check] {notices_path} (0 CR bytes, sha256={want_sha[:16]}) matches binary licenses/--licenses byte-for-byte.")
          ' "dist/$ASSET_NAME" "dist/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt"

      - name: Smoke test binary
        # F-a6fa29e0: the build succeeding is not the same as the binary
        # running -- this is precisely why F-a4d8291c's 100%-reproducible
        # crash shipped undetected through two tagged releases. Runs once per
        # matrix leg so a platform-specific packaging regression is also
        # caught. Asserts process startup (--help), the loaded event count
        # against a FLOOR of 200 (not an exact 260 -- see MIN_EXPECTED_EVENTS
        # in scripts/smoke_test_binary.py: a floor sits above the
        # 60-hardcoded-only quarter-game failure mode while not breaking on
        # ordinary content growth/trimming of the JSON library the way an
        # exact-equality check would), and (F-03194eb2) that tui.tcss itself
        # actually loads -- see scripts/smoke_test_binary.py for why a
        # startup-only check catches neither bundled-file failure mode.
        #
        # F-cbe6aac9: read the shell env var directly ($ASSET_NAME, already
        # exported by $GITHUB_ENV two steps up) -- never re-enter it into a
        # run: block via ${{ }}. ASSET_NAME traces back to VERSION, derived
        # from the same unvalidated workflow_dispatch `tag` input REF_NAME_RAW
        # guards above; template substitution happens before bash parses this
        # script, so doing that a second time here would silently undo
        # F-812f18ad's fix.
        shell: bash
        run: uv run --no-sync python scripts/smoke_test_binary.py "dist/$ASSET_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          # F-812f18ad: same env-indirection fix as the build job's "Build
          # binary" step -- see the comment there for the full rationale.
          # This job additionally holds `permissions: contents: write` and
          # calls softprops/action-gh-release, so an injection here could
          # tamper with the release or exfiltrate GITHUB_TOKEN.
          REF_NAME_RAW: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          REF_NAME="$REF_NAME_RAW"
          VERSION=${REF_NAME#v}
          cd artifacts
          sha256sum * > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: artifacts/*
          tag_name: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
