name: Release

# Publishes the npm binary-launcher wrapper (@mcptoolshop/escape-the-valley) via
# OIDC trusted publishing — NO NPM_TOKEN — and creates the GitHub Release.
# Creating the Release with GITHUB_TOKEN does NOT fire `release: published`
# (GitHub's recursion guard), so publish.yml (PyPI) and release-binaries.yml
# (the binaries the npm wrapper downloads) chain off this workflow COMPLETING
# via `workflow_run`. This workflow's filename (release.yml) is bound to the npm
# trusted publisher for mcp-tool-shop-org/escape-the-valley; do not rename it.
#
# Pre-condition (one-time, Mike-action at npmjs.com):
#   npmjs.com -> @mcptoolshop/escape-the-valley -> Settings -> Trusted Publisher
#     Organization/Repository: mcp-tool-shop-org/escape-the-valley
#     Workflow filename:        release.yml
#     Environment:              (leave empty)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialize per-tag releases; do NOT cancel an in-flight release on a re-push of
# the same tag. Cancelling a mid-flight `npm publish` after the Sigstore
# provenance attestation is signed but before the registry packument commits
# leaves retries failing with E409 for 5-30 minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Release creation
  id-token: write   # npm provenance + OIDC trusted-publishing auth

jobs:
  release:
    name: Publish npm (OIDC) + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm >=11.5 in a sandbox for OIDC trusted-publishing auth
        run: |
          # Node 22 ships npm 10.9, which signs Sigstore provenance but cannot
          # negotiate the OIDC auth path for trusted publishing (the PUT returns
          # a misleading 404 "not in this registry"). An in-place
          # `npm install -g npm@latest` races on the bundled npm's arborist
          # rebuild and breaks irrecoverably; a sandbox install + PATH shadow
          # avoids the race. See memory: npm-115-required-for-oidc.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # tomllib is stdlib in 3.11+; pin 3.11 so the check is reproducible across
      # runner-image bumps (matches ci.yml / publish.yml setup-python SHA).
      - name: Setup Python for pyproject version check
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Verify tag matches pyproject.toml version
        run: |
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: ${PY_VERSION}"
          if [ "${PY_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match pyproject.toml version ${PY_VERSION}"
            exit 1
          fi

      # The wrapper's sole dep is @mcptoolshop/npm-launcher (digest-locked by the
      # registry); no package-lock.json is committed, so `npm install` is honest.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: npm pack dry-run (verify tarball shape)
        run: npm pack --dry-run

      # F-f5e1f24d: this step (idempotent -- `gh release view` skip-guard
      # below) now runs BEFORE the non-idempotent, irreversible npm publish.
      # Previously npm publish ran first: if this step then failed for any
      # reason (transient `gh` API error, GitHub outage), the whole workflow
      # run failed, which means publish.yml and release-binaries.yml (both
      # gated on `workflow_run.conclusion == 'success'` for THIS workflow)
      # never ran -- yet a retry via workflow_dispatch would re-attempt the
      # already-succeeded npm publish and fail every time with E403 ("cannot
      # publish over previously published version"), permanently wedging the
      # release chain until a human intervened by hand.
      #
      # With the idempotent step first: if IT fails, npm publish never runs
      # (no side effect yet). If it succeeds and npm publish then fails, a
      # re-run is now safe -- this step sees the release already exists and
      # skips creation, and npm publish retries cleanly since it hasn't
      # succeeded yet.
      #
      # Manual recovery (compensators, in case a retry still won't clear it):
      #   - npm publish already succeeded but this workflow run shows failed:
      #     check `npm view @mcptoolshop/escape-the-valley@<version> version`
      #     -- if it resolves, npm is done; do NOT re-run npm publish. Instead
      #     `workflow_dispatch` publish.yml and release-binaries.yml directly
      #     (both already support manual dispatch) to finish PyPI + binaries.
      #   - GitHub Release needs to be undone: `gh release delete <tag>
      #     --yes` (owner: whoever is on call; this only removes the Release
      #     object + its assets, it does not touch the git tag or npm).
      #   - npm publish needs to be undone: npm does not support unpublishing
      #     a version older than 72h in the general case -- the safe
      #     compensator is `npm deprecate @mcptoolshop/escape-the-valley@<version>
      #     "broken release, use <next-version> instead"` plus cutting a
      #     fixed patch release, not a force-unpublish.
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the `## [<version>] - ...` section from CHANGELOG.md as notes;
          # fall back to the tag name if the section is missing.
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          # Match the heading literally with index() — a dynamic regex with
          # escaped brackets (\[ \]) is treated as a character class by some awk
          # variants, which silently yields empty notes.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "Escape the Valley ${GITHUB_REF_NAME}" > "${NOTES_FILE}"
            echo "" >> "${NOTES_FILE}"
            echo "See CHANGELOG.md for details." >> "${NOTES_FILE}"
          fi

          # Idempotent: skip creation if the release already exists (re-pushed
          # tag / workflow_dispatch re-run). Publishing the release lets the
          # downstream workflow_run chain (publish.yml + release-binaries.yml) run.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping create."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Escape the Valley ${GITHUB_REF_NAME}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag
          fi

      # F-f5e1f24d: intentionally last. npm publish is irreversible and NOT
      # retry-safe (a second `npm publish` of the same version fails with
      # E403), so it now runs only after the idempotent GitHub Release step
      # above has already succeeded -- see the comment on that step for the
      # full ordering rationale and the manual recovery/compensator steps.
      - name: Publish to npm with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
