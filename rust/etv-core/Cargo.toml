[package]
name = "etv-core"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
authoring = []
narrator-ollama = ["dep:ureq"]
# The hosted narrator over HTTPS (native TLS): in play, Claude or an OpenAI-compatible endpoint
# chosen in the settings; in narrator_measure, the Claude API for measurement runs.
narrator-claude = ["narrator-ollama", "ureq/native-tls"]

[[bin]]
name = "etv"
path = "src/bin/etv.rs"

[[bin]]
name = "narrator_measure"
path = "src/bin/narrator_measure.rs"
required-features = ["narrator-ollama"]

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
getrandom = "0.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
ureq = { version = "=3.4.2", default-features = false, optional = true }

[dev-dependencies]
flate2 = "1.1"
tempfile = "3.19"
