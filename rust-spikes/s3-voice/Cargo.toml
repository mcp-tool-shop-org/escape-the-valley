[package]
name = "s3-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
hound = "3.5.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "native-tls"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
